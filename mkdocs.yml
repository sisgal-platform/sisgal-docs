site_name: SISGAL Documentation
site_description: Sistema de Gestión de Asistencia y Liquidación de Nómina
site_author: Tatiana Sánchez Sanín
repo_url: https://github.com/sisgal-platform/sisgal-docs
repo_name: sisgal-platform/sisgal-docs

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Inicio: index.md
  - Manual de usuario:
      - Introducción: user-guide/index.md
      - Acceso y navegación: user-guide/access-navigation.md
      - Gestión de empleados: user-guide/employees.md
      - Registro de asistencia: user-guide/attendance.md
      - Liquidación de nómina: user-guide/payroll.md
      - Consultas y reportes: user-guide/reports.md
      - Preguntas frecuentes: user-guide/faq.md
  - Manual técnico:
      - Introducción: technical-guide/index.md
      - Instalación y entorno: technical-guide/setup.md
      - Configuración: technical-guide/configuration.md
      - Operación y despliegue: technical-guide/operations.md
      - Mantenimiento: technical-guide/maintenance.md
      - Seguridad: technical-guide/security.md
      - Desarrollo y contribución: technical-guide/contributing.md
      - Arquitectura: architecture/index.md
      - Dominio del negocio: domain/index.md
      - API: api/index.md
      - Decisiones técnicas: decisions/index.md
      - ADR: adr/index.md
      - Deployment: deployment/index.md
      - Backlog y releases: backlog/index.md
